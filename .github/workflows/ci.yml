name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, curl, zip
          coverage: none
          tools: composer

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    env:
      VITE_API_URL: https://backend-production-f646a509.up.railway.app/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  railway-deploy-gate:
    name: Railway deployment gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: CI passed
        run: echo "CI passed. Railway native GitHub deployments may proceed."
